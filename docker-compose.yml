version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: nutrition-app-db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-nutrition_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-nutrition_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend Service (Node.js Express REST API)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    image: nutrition-app-backend:latest
    container_name: nutrition-app-backend
    restart: always
    environment:
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-nutrition_db}
      DATABASE_URL: postgres://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-nutrition_db}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  # Frontend Service (React + Vite + Nginx)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    image: nutrition-app-frontend:latest
    container_name: nutrition-app-frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
